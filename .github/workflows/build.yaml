name: TubeArchivistMetadata Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (example: v1.4.5)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Release
    permissions:
      contents: write
      packages: read

    steps:
      - name: Resolve release tag and version
        id: release_meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
            CHECKOUT_REF="refs/tags/$TAG"
          else
            TAG="$REF_NAME"
            CHECKOUT_REF="$REF"
          fi

          if [[ -z "$TAG" ]]; then
            echo "Unable to resolve release tag."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Release tag must match v<major>.<minor>[.<patch>[.<build>]]."
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release_meta.outputs.checkout_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Add Jellyfin GitHub NuGet registry to sources
        env:
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if dotnet nuget list source | grep -Eq '^[[:space:]]*[0-9]+\.[[:space:]]+github[[:space:]]+\[(Enabled|Disabled)\]'; then
            dotnet nuget update source github \
              --source https://nuget.pkg.github.com/jellyfin/index.json \
              --username DarkFighterLuke \
              --password "$NUGET_TOKEN" \
              --store-password-in-clear-text
          else
            dotnet nuget add source \
              --username DarkFighterLuke \
              --password "$NUGET_TOKEN" \
              --store-password-in-clear-text \
              --name github https://nuget.pkg.github.com/jellyfin/index.json
          fi

      - name: Generate release message
        run: |
          changelog=$(awk '/changelog:/ {flag=1; next} /^[^ ]/ {flag=0} flag' build.yaml | awk '{$1=$1};1')
          if [[ $(echo "$changelog" | wc -l) -gt 1 ]]; then
            changelog=$(echo "$changelog" | sed 's/^/* /')
          else
            changelog="* $changelog"
          fi
          echo "Changelog:" > release-changelog.md
          echo "$changelog" >> release-changelog.md

      - name: Build Jellyfin Plugin
        id: jprm
        uses: DarkFighterLuke/jellyfin-plugin-repository-manager@7a96768accc155ac7b597351b5033532f3c48173
        with:
          dotnet-target: net9.0
          version: ${{ steps.release_meta.outputs.version }}
          update-manifest: "true"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ steps.jprm.outputs.artifact }}
          makeLatest: true
          bodyFile: release-changelog.md
          tag: ${{ steps.release_meta.outputs.release_tag }}
          allowUpdates: true

      - name: Commit manifest.json to default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- manifest.json; then
            echo "manifest.json unchanged."
            exit 0
          fi

          cp manifest.json /tmp/manifest.json
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          cp /tmp/manifest.json manifest.json

          if git diff --quiet -- manifest.json; then
            echo "No manifest updates to commit on $DEFAULT_BRANCH."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit --signoff -m "Update manifest.json"

          for push_attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              break
            fi

            if [[ "$push_attempt" -eq 3 ]]; then
              echo "Failed to push manifest update to $DEFAULT_BRANCH after 3 attempts."
              exit 1
            fi

            echo "Push failed due to concurrent updates, rebasing and retrying..."
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH" || {
              echo "Failed to rebase manifest update onto $DEFAULT_BRANCH."
              exit 1
            }
          done
