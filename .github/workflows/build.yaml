name: TubeArchivistMetadata Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (example: v1.4.5)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Release
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag and version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [[ -z "$TAG" ]]; then
            echo "Unable to resolve release tag."
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Add Jellyfin GitHub NuGet registry to sources
        run: |
          dotnet nuget add source \
            --username DarkFighterLuke \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github https://nuget.pkg.github.com/jellyfin/index.json || true

      - name: Generate release message
        run: |
          changelog=$(awk '/changelog:/ {flag=1; next} /^[^ ]/ {flag=0} flag' build.yaml | awk '{$1=$1};1')
          if [[ $(echo "$changelog" | wc -l) -gt 1 ]]; then
            changelog=$(echo "$changelog" | sed 's/^/* /')
          else
            changelog="* $changelog"
          fi
          echo "Changelog:" > release-changelog.md
          echo "$changelog" >> release-changelog.md

      - name: Build Jellyfin Plugin
        id: jprm
        uses: DarkFighterLuke/jellyfin-plugin-repository-manager@7a96768accc155ac7b597351b5033532f3c48173
        with:
          dotnet-target: net9.0
          version: ${{ env.VERSION }}
          update-manifest: "true"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ steps.jprm.outputs.artifact }}
          makeLatest: true
          bodyFile: release-changelog.md
          tag: ${{ env.RELEASE_TAG }}
          allowUpdates: true

      - name: Commit manifest.json
        uses: EndBug/add-and-commit@v9
        with:
          add: manifest.json
          commit: --signoff
          message: "Update manifest.json for ${{ env.RELEASE_TAG }}"
